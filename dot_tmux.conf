# Use Ctrl+h and Ctrl+l to move between panes
bind -n C-h select-pane -L
bind -n C-l select-pane -R

# Split side-by-side with prefix + |
bind | split-window -h

# Make Escape responsive in terminal applications
set -sg escape-time 10

# Hide the status bar
set -g status off

# Alt+Shift+= (Alt+ plus) creates a vertical split
bind -n M-+ split-window -h

# Keep pane borders visually consistent
set -g pane-border-style 'fg=colour8'
set -g pane-active-border-style 'fg=colour8'
